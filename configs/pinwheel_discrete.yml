training:
  batch_size: 256 # 1000
  n_epochs: 500
  n_iters: 1000001
  snapshot_freq: 10
  snapshot_sampling: true
  # discrete: true
  discrete: true
  alpha: 0.01


test:
  begin_ckpt: 5000
  end_ckpt: 300000                     
  batch_size: 128

data:
  n_classes: 5
  dataset: "PinWheel"
  samplesize: 10_000
  test_samplesize: 1_000
  size: 2
  num_workers: 0
  dtype: torch.float32
  logit_transform: true

sample:
  n_gen: 5000

model:
  path: 'ot'
  nllk: true
  v: 0.1
  ngf: 200 # 200 # 100 # 512
  fixz: true
  freqs: 2

optim:
  weight_decay: 0.0001
  lr: 0.0001 # 0.001 # try to use even smaller step size for the coupled ODE system
  multiplier: .8 # 1. larger is more concentrated?
  clip_value: 1.
  eps: 0.00000001

flow:
  k_dim: 5 # use even number for flow model
  z_dim: 1
  n_comp: 5
  freqs: 2
  ngf: 200 # 200 # 100 # 512 # should be the same as model ngf, otherwise easily goes off to infinity
  sig_min: .00001
  mul: .001 # this is to decrease the impact of div estimate on the ODE solver - make it faster by scaling it down
  tau: 1.
  beta: 1. # higher promotes uniformity
  fix_z: true
  fix_pi: true #false

baseline:  # baselines in benchmarks/ (not the authors' code)
  mixture_svae:  # Mixture-SVAE (Table 1 / Fig. 1). The paper does not state these; chosen for pinwheel:
    enc_width: 200     # q(xi|x) and q(z|x,xi): 2 x 200 tanh hidden units
    enc_depth: 2
    dec_width: 200     # p(x|z): 4 x 200
    dec_depth: 4
    xi_embed: 5        # xi enters q(z|x,xi) through a K -> K linear map (equivalent to concatenating xi)
    prior_means: linspace  # component means -4, -2, 0, 2, 4
    prior_scale: 4.
    prior_std: 0.5
    temp: 1.           # Gumbel-Softmax temperature annealed from 1.0 to 0.5 during training
    temp_min: 0.5
    min_std: 1.e-4
